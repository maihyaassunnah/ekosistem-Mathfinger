services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathfingers-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-mathfingers_db}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://mathfingers.my.id}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super-secret-mathfingers-key-2026}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://mathfingers.my.id}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mathfingers-network

  db:
    image: postgres:16-alpine
    container_name: mathfingers-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-mathfingers_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mathfingers_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mathfingers-network

  # Web-based Database Manager (PGWeb - backup)
  db-web:
    image: sosedoff/pgweb:latest
    container_name: mathfingers-db-web
    restart: always
    command: ["/usr/bin/pgweb", "--bind=0.0.0.0", "--listen=8081", "--url=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-mathfingers_db}?sslmode=disable", "--auth-user=admin", "--auth-pass=MathFingers2026!"]
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mathfingers-network

  # Prisma Studio - Visual Database Editor (accessible at db.mathfingers.my.id)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathfingers-prisma-studio
    restart: always
    command: ["npx", "prisma", "studio", "--hostname", "0.0.0.0", "--port", "5555", "--browser", "none"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-mathfingers_db}?schema=public
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mathfingers-network

volumes:
  postgres_data:
    driver: local

networks:
  mathfingers-network:
    driver: bridge
